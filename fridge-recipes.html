<body>
  <div class="page">
    <div class="hero">
      <a href="/">&larr; Back</a>
      <h1>🍳 Fridge Recipe Helper</h1>
      <p>Type your fridge ingredients and get recipe ideas. Filter by cuisine, flavor, and dietary preferences.</p>
    </div>

    <div class="panel">
      <div class="input-row">
        <div class="input-group">
          <label for="ingredientsInput">Enter ingredients (comma or newline separated)</label>
          <textarea id="ingredientsInput" placeholder="e.g. eggs, milk, spinach&#10;or paste a fridge list"></textarea>
        </div>
        <div class="input-group">
          <label for="imageInput">Or upload a photo of your fridge</label>
          <input type="file" id="imageInput" accept="image/*" />
        </div>
      </div>

      <div class="row">
        <div class="filter-section">
          <label class="filter-label">Cuisine</label>
          <div class="filter-buttons" id="cuisineFilters"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">Flavor</label>
          <div class="filter-buttons" id="flavorFilters"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">Dietary</label>
          <div class="filter-buttons" id="dietaryFilters"></div>
        </div>
      </div>

      <div class="buttons">
        <button class="primary" id="findBtn">Find recipes</button>
        <button class="secondary" id="sampleBtn">Use sample fridge</button>
        <button class="text" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="results" id="results"></div>
  </div>

      { name: 'Pineapple Buns', description: 'Sweet Hong Kong pastry with pineapple topping.', ingredients: ['flour', 'sugar', 'butter', 'eggs', 'milk', 'pineapple jam'], image: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=400&h=300&fit=crop', cuisines: ['Chinese - Cantonese'], flavors: ['sweet'], dietaries: ['healthy'], tutorial: 'https://omnivorescookbook.com/pineapple-buns/' }
    ];

    const ingredientInput = document.getElementById('ingredientsInput');
    const findBtn = document.getElementById('findBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const clearBtn = document.getElementById('clearBtn');
    const results = document.getElementById('results');
    const imageInput = document.getElementById('imageInput');
    
    const sampleIngredients = 'eggs, milk, spinach, tomato, cheese, bread, avocado';
    let selectedCuisines = [];
    let selectedFlavors = [];
    let selectedDietaries = [];

    function normalizeIngredient(text) {
      return text
        .toLowerCase()
        .replace(/\b(and|or|with|fresh|large|small|cup|cups|slice|slices|a|the)\b/g, ' ')
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseIngredients(text) {
      if (!text || !text.trim()) return [];
      return text
        .split(/[\n,;]+/)  
        .map(part => normalizeIngredient(part))
        .filter(Boolean);
    }

    function matchRecipe(recipe, available) {
      const required = recipe.ingredients.map(normalizeIngredient).filter(Boolean);
      const found = required.filter(req =>
        available.some(item => item.includes(req) || req.includes(item))
      );
      return {
        recipe,
        foundCount: found.length,
        missing: required.filter(req => !found.includes(req))
      };
    }

    function showResults(ingredients) {
      results.innerHTML = '';
      const available = ingredients.map(normalizeIngredient).filter(Boolean);
      if (!available.length) {
        results.innerHTML = '<div class="card heading-card"><div style="padding: 20px;"><p class="note">Enter ingredients so the helper can suggest recipes.</p></div></div>';
        return;
      }

      let matches = recipes.map(recipe => matchRecipe(recipe, available));
      
      // Filter by selected categories
      matches = matches.filter(item => {
        const passedCuisine = selectedCuisines.length === 0 || item.recipe.cuisines.some(c => selectedCuisines.includes(c));
        const passedFlavor = selectedFlavors.length === 0 || item.recipe.flavors.some(f => selectedFlavors.includes(f));
        const passedDietary = selectedDietaries.length === 0 || item.recipe.dietaries.some(d => selectedDietaries.includes(d));
        return passedCuisine && passedFlavor && passedDietary;
      });
      
      const perfect = matches.filter(item => item.missing.length === 0);
      const partial = matches
        .filter(item => item.missing.length > 0)
        .sort((a, b) => b.foundCount - a.foundCount || a.missing.length - b.missing.length);

      if (perfect.length) {
        const heading = document.createElement('div');
        heading.className = 'card heading-card';
        heading.innerHTML = '<div style="padding: 20px;"><h2>Recipes you can make now</h2><p>These recipes match your ingredients.</p></div>';
        results.appendChild(heading);
        perfect.forEach(item => results.appendChild(createRecipeCard(item, true)));
      } else if (partial.length) {
        const heading = document.createElement('div');
        heading.className = 'card heading-card';
        heading.innerHTML = '<div style="padding: 20px;"><h2>Close matches</h2><p>These recipes are close. Add the missing ingredient(s) to complete them.</p></div>';
        results.appendChild(heading);
      } else {
        const heading = document.createElement('div');
        heading.className = 'card heading-card';
        heading.innerHTML = '<div style="padding: 20px;"><p class="note">No recipes match your filters. Try different selections.</p></div>';
        results.appendChild(heading);
        return;
      }

      partial.slice(0, 8).forEach(item => results.appendChild(createRecipeCard(item, false)));
    }

    function createRecipeCard(match, exact) {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <img src="${match.recipe.image}" alt="${match.recipe.name}" class="card-image" />
        <div class="card-content">
          <h2>${match.recipe.name}</h2>
          <p>${match.recipe.description}</p>
          <p><strong>Ingredients:</strong></p>
          <ul class="chips">${match.recipe.ingredients.map(i => `<li class="chip">${i}</li>`).join('')}</ul>
          ${exact ? '<p class="note">All required ingredients are available.</p>' : `<p class="note">Missing: ${match.missing.join(', ')}</p>`}
          <a href="${match.recipe.tutorial}" target="_blank" rel="noopener noreferrer" class="recipe-link">Learn how to make it</a>
        </div>
      `;
      return card;
    }

    function initializeFilters() {
      const cuisines = [...new Set(recipes.flatMap(r => r.cuisines))].sort();
      const flavors = [...new Set(recipes.flatMap(r => r.flavors))].sort();
      const dietaries = [...new Set(recipes.flatMap(r => r.dietaries))].sort();

      const cuisineContainer = document.getElementById('cuisineFilters');
      cuisines.forEach(cuisine => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cuisine;
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          selectedCuisines = Array.from(cuisineContainer.querySelectorAll('.filter-btn.active')).map(b => b.textContent);
          if (ingredientInput.value.trim()) showResults(parseIngredients(ingredientInput.value));
        });
        cuisineContainer.appendChild(btn);
      });

      const flavorContainer = document.getElementById('flavorFilters');
      flavors.forEach(flavor => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = flavor;
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          selectedFlavors = Array.from(flavorContainer.querySelectorAll('.filter-btn.active')).map(b => b.textContent);
          if (ingredientInput.value.trim()) showResults(parseIngredients(ingredientInput.value));
        });
        flavorContainer.appendChild(btn);
      });

      const dietaryContainer = document.getElementById('dietaryFilters');
      dietaries.forEach(dietary => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = dietary;
        btn.addEventListener('click', () => {
          btn.classList.toggle('active');
          selectedDietaries = Array.from(dietaryContainer.querySelectorAll('.filter-btn.active')).map(b => b.textContent);
          if (ingredientInput.value.trim()) showResults(parseIngredients(ingredientInput.value));
        });
        dietaryContainer.appendChild(btn);
      });
    }

    findBtn.addEventListener('click', () => showResults(parseIngredients(ingredientInput.value)));
    sampleBtn.addEventListener('click', () => {
      ingredientInput.value = sampleIngredients;
      showResults(parseIngredients(sampleIngredients));
    });
    clearBtn.addEventListener('click', () => {
      ingredientInput.value = '';
      results.innerHTML = '';
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      selectedCuisines = [];
      selectedFlavors = [];
      selectedDietaries = [];
    });

    ingredientInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.shiftKey) {
        event.preventDefault();
        showResults(parseIngredients(ingredientInput.value));
      }
    });

    initializeFilters();
  </script>
